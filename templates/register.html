<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FreshGuard - Create Account</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #f8fafc, #eef4ff);
            color: #172033;
        }

        .navbar {
            height: 72px;
            background: white;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 23px;
        }

        .brand-name {
            font-size: 20px;
            font-weight: bold;
        }

        .login-link {
            color: #2563eb;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
        }

        .page {
            min-height: calc(100vh - 72px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 35px 20px;
        }

        .card {
            width: 100%;
            max-width: 470px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(15, 23, 42, 0.10);
            overflow: hidden;
        }

        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            border-bottom: 1px solid #e2e8f0;
            padding: 8px;
            gap: 5px;
        }

        .tab {
            padding: 12px;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            border-radius: 10px;
        }

        .tab.active {
            color: #2563eb;
            background: white;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
        }

        .content {
            padding: 32px 35px;
        }

        h1 {
            text-align: center;
            font-size: 25px;
            margin-bottom: 9px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .field {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            color: #334155;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            height: 46px;
            border: 1px solid #dbe3ee;
            border-radius: 10px;
            padding: 0 14px;
            font-size: 13px;
            outline: none;
            background: #f8fafc;
        }

        input:focus {
            border-color: #2563eb;
            background: white;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        .create-button {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        .create-button:hover {
            background: #1d4ed8;
        }

        .error {
            background: #fee2e2;
            color: #dc2626;
            border: 1px solid #fecaca;
            padding: 11px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 12px;
            text-align: center;
        }

        .success {
            background: #dcfce7;
            color: #15803d;
            border: 1px solid #bbf7d0;
            padding: 11px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 12px;
            text-align: center;
        }

        .signin {
            text-align: center;
            margin-top: 20px;
        }

        .signin a {
            color: #2563eb;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
        }

        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-top: 1px solid #e2e8f0;
            background: white;
            color: #94a3b8;
            font-size: 11px;
        }

    </style>

</head>

<body>


<header class="navbar">

    <div class="brand">

        <div class="brand-icon">
            🍌
        </div>

        <div class="brand-name">
            FreshGuard
        </div>

    </div>

    <a
        href="{{ url_for('login') }}"
        class="login-link">

        ← Back to Sign In

    </a>

</header>


<main class="page">

    <div class="card">


        <div class="tabs">

            <div class="tab">

                <a
                    href="{{ url_for('login') }}"
                    style="text-decoration:none;color:#475569;">

                    Sign In

                </a>

            </div>

            <div class="tab active">

                Create Account

            </div>

        </div>


        <div class="content">

            <h1>
                Create Account
            </h1>

            <p class="subtitle">

                Create your FreshGuard inspection account

            </p>


            {% if error %}

            <div class="error">

                {{ error }}

            </div>

            {% endif %}


            {% if success %}

            <div class="success">

                {{ success }}

            </div>

            {% endif %}


            <form
                method="POST"
                action="{{ url_for('register') }}">


                <div class="field">

                    <label>
                        Full Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="field">

                    <label>
                        Email Address
                    </label>

                    <input
                        type="email"
                        name="email"
                        placeholder="inspector@freshguard.com"
                        required
                    >

                </div>


                <div class="field">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <div class="field">

                    <label>
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        name="confirm_password"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="create-button">

                    Create Account →

                </button>

            </form>


            <div class="signin">

                <a href="{{ url_for('login') }}">

                    Already have an account?
                    Sign In

                </a>

            </div>

        </div>

    </div>

</main>


<footer>

    FreshGuard &nbsp; • &nbsp;
    Food Freshness Detection

</footer>


</body>

</html>
